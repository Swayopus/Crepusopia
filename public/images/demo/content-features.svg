  <path d="M0 580 L150 490 L310 570 L500 460 L680 580 L860 500 L1040 585 L1200 510 L1200 675 L0 675 Z" fill="#363a52" />
  <path d="M0 630 L220 560 L400 620 L620 545 L820 625 L1010 570 L1200 620 L1200 675 L0 675 Z" fill="#242a3d" />

