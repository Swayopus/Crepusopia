<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title">
  <title id="title">暮色中的层叠山峦与落日插画</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3f63" />
      <stop offset="0.45" stop-color="#7d6a83" />
      <stop offset="0.72" stop-color="#d9a06f" />
      <stop offset="1" stop-color="#f7eedd" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6b0" />
      <stop offset="1" stop-color="#f2a65a" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffdca8" stop-opacity="0.85" />
      <stop offset="1" stop-color="#ffdca8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)" />
